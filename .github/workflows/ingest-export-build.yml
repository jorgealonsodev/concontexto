name: ingest-export-build

# Task 4.13 (design D-1's own framing: "This is the test that kills the
# 'built, tested, never connected' shape"; spec publishing-export, "One
# end-to-end ingest-then-build test exists"). Fase 0 produced eight
# components that were built, tested and never connected -- publishing's
# hand-off between Go and Node (a JSON artifact one ecosystem writes and
# the other reads) is exactly that failure shape at its most likely, so
# this job runs the real chain -- ingest, export, astro build -- as one
# CI unit, separate from ci.yml's own go/web jobs so a regression in
# this specific hand-off is visible on its own line rather than buried
# inside a broader suite.
#
# WHAT THIS JOB PROVES, AS OF SLICE 9a/9b.
#   1. The chain is REAL: the artifact the Go end-to-end test exports is
#      the artifact `astro build` consumes. Both halves are pointed at the
#      ONE directory EXPORT_ARTIFACT_DIR names below. This was previously
#      NOT true -- the Go test exported into a t.TempDir() it discarded on
#      exit, while the build step set neither EXPORT_URL nor EXPORT_DIR and
#      so fell back to the checked-in fixture. The two steps looked like a
#      chain and were two unrelated runs in sequence: this job, created to
#      kill the "built, tested, never connected" shape, was exhibiting it.
#   2. The build genuinely READS those bytes: the six frozen indicator
#      routes are emitted, and the latest value the artifact carries is
#      asserted to appear in the rendered HTML.
#   3. A CORRUPTED artifact FAILS the build, non-zero, three ways (stale
#      sha256, wrong schema_version, Zod shape violation).
#   4. A series a REAL validation rule BLOCKED fails the build too, and the
#      ingest that produces that block runs with the REAL per-series
#      thresholds from config/series/*.yaml. See below.
#
# WHAT THIS JOB PROVES, ADDED BY VERIFY-REPORT CRITICAL-37.
# Point 1 above was true and still is, but the ingest behind it was running
# with `config.ValidationConfig{}` -- no thresholds at all -- over
# three-period fixtures. The one job proving the Go->Astro hand-off had the
# guard that blocks a series in production switched OFF, and no input this
# repository can produce could have turned it red for a validation failure.
# That is the FIFTH time a check has been found positioned where its failure
# cannot occur; the previous four were in gates, this one was in the entire
# CI corpus.
#
# The failure it could not see is live right now. `ocupados-epa` breaches
# `config/series/ocupados-epa.yaml`'s `max_delta_abs: 1000` at 2020-Q2 (a
# fall of 1074.1 thousand employed persons -- the COVID-19 lockdown
# quarter), `config/reconocimientos.yaml` carries the resolving record
# UNSIGNED, so every real ingest blocks the series, the export omits it, and
# a production `astro build` fails on the frozen-route guard.
#
# TWO SHAPES WERE POSSIBLE HERE, AND THE CHOICE IS DELIBERATE.
#   (b) rejected: ingest the COVID range with real thresholds and require
#       the whole chain to SUCCEED. That job is red TODAY and stays red
#       until a human signs a YAML file. CI would be reporting a pending
#       editorial decision rather than a fact about the code, and a
#       permanently-red job is an ignored job within a week.
#   (a) chosen: prove the FAILURE path. The blocked arm below asserts that
#       the pipeline blocks the series it should block, that the export
#       omits it, and that `astro build` then exits non-zero naming the
#       frozen route. Green today, for the right reason.
# The successful arm is unchanged and still runs over the recorded
# last-3-period fixtures -- now with the real thresholds applied, which is
# (b) kept where it can be honestly green.
#
# WHAT WOULD HAVE TO BREAK FOR THE NEW ARM TO GO RED, AND CAN IT?
#   - `ineIngestConfig` stops carrying the real `validation:` block: the
#     COVID quarter publishes, the artifact carries all six, the blocked
#     build SUCCEEDS -> red. This is a revert of a change in this very
#     commit, so it is the most likely of the four.
#   - `config/series/ocupados-epa.yaml` raises `max_delta_abs` above 1074.1
#     (the "blind the guard permanently" remedy the acknowledgement
#     registry exists to avoid): same.
#   - `publishing.Export` stops skipping zero-observation series: same.
#   - `resolveIndicatorRouteSlugs` goes back to filtering rather than
#     throwing: the build emits five pages, exits 0 -> red.
# All four are ordinary edits, and each is caught here rather than by a
# reader hitting a 404 on a permalink this project promised to keep.
#
# Superseded rationale, named here on purpose rather than quietly deleted:
# this job used to disclose that the corruption half could not be proven
# "because the Zod content loader is slice 9a's own deliverable, not yet
# built". That loader (web/src/lib/export/loader.ts) has existed since
# slice 9a and is wired into /indicador/[slug].astro's getStaticPaths, so
# the blocker expired. What remained open was narrower and is what points
# 1-3 above now close.
#
# The write-side protection (publishing.ValidateArtifact never writes an
# invalid artifact in the first place) is separate and older, exercised by
# the Go step. Points 2 and 3 are the READ side: they prove the build is
# not merely tolerating whatever it is handed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ingest-export-build:
    name: Ingest fixtures -> export -> astro build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # ONE definition, read by BOTH halves of the chain: the Go step
      # exports here (E2E_EXPORT_DIR), the build step reads here
      # (EXPORT_DIR). Declared once at job level rather than repeated as
      # two literals, because two literals are exactly how the halves
      # silently drifted apart before. Job-level env is exported into every
      # step's shell, so the steps below reference "$EXPORT_ARTIFACT_DIR"
      # directly and no step can be pointed elsewhere by accident.
      # `github.workspace`, not `runner.temp`: the `runner` context is not
      # available in job-level `env`.
      EXPORT_ARTIFACT_DIR: ${{ github.workspace }}/.e2e-export-artifact

      # The second artifact, and deliberately a SEPARATE directory rather
      # than a reused one: this job now produces two artifacts in a single
      # `go test` invocation and hands them to two opposite assertions --
      # one requiring a green build, one requiring a red one. One directory
      # would let the second export overwrite the first and make the pair
      # meaningless.
      BLOCKED_ARTIFACT_DIR: ${{ github.workspace }}/.e2e-blocked-artifact

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A real ingestion.IngestSeries run for the synthetic probe series
      # AND all six frozen slugs, each against its own recorded fixture,
      # through a real Postgres transaction (testcontainers-go -- Docker is
      # preinstalled on GitHub-hosted runners, no separate service
      # container needed), followed by a real publishing.Export.
      #
      # E2E_EXPORT_DIR is what makes this step's output survive the test
      # process: without it the export lands in a t.TempDir() that Go
      # deletes on exit, and everything downstream silently reads the
      # checked-in fixture instead. The export must happen IN this process
      # -- the test's rows live in a transaction that is rolled back, so no
      # separate `concontexto export` invocation could ever see them.
      #
      # If the export writer and its own postgres reader ever stop
      # agreeing, this step fails here -- before the build step below ever
      # runs -- rather than in production.
      #
      # BOTH artifacts come out of ONE invocation (CRITICAL-37): the honest
      # one from TestEndToEndIngestExportBuild, and the blocked one from
      # TestEndToEndBlockedSeriesIsAbsentFromTheExportedArtifact, which
      # ingests the same six series with `ocupados-epa` served its recorded
      # COVID-quarter payload so the shipped `max_delta_abs` genuinely
      # fires. One invocation because they share the testcontainers
      # Postgres; two directories because they feed opposite assertions.
      #
      # Both tests now ingest with the REAL per-series `validation:` blocks
      # read out of config/series/*.yaml (ineIngestConfig ->
      # realValidationConfig), not the zero-valued ValidationConfig this
      # step used to run with.
      - name: Ingest fixtures with the REAL config thresholds -> export (Go end-to-end tests)
        run: |
          E2E_EXPORT_DIR="$EXPORT_ARTIFACT_DIR" \
          E2E_BLOCKED_EXPORT_DIR="$BLOCKED_ARTIFACT_DIR" \
            go test -count=1 \
              -run 'TestEndToEndIngestExportBuild|TestEndToEndBlockedSeriesIsAbsentFromTheExportedArtifact' \
              -v ./app/internal/ingestion/...

      # Fails loudly if the hand-off broke -- a renamed environment
      # variable, a skipped test, an export that wrote elsewhere.
      #
      # This step used to be the ONLY thing standing between a broken hand-off
      # and a green, meaningless pass, because the build step would then have
      # fallen back to the checked-in synthetic fixture. That fallback is gone
      # (verify-report CRITICAL-15: the loader now refuses to guess, and an
      # EXPORT_DIR pointing at nothing is a non-zero build). The step stays
      # anyway: failing HERE names the actual cause -- the Go export -- instead
      # of surfacing as a missing-file error one step later.
      - name: Assert the exported artifact is where the build will read it
        run: |
          test -f "$EXPORT_ARTIFACT_DIR/manifest.json" || {
            echo "No manifest.json in $EXPORT_ARTIFACT_DIR: the Go step did not export here." >&2
            echo "The build step below reads exactly this directory (EXPORT_DIR) and will exit non-zero." >&2
            exit 1
          }
          echo "The astro build will read these exact bytes:"
          find "$EXPORT_ARTIFACT_DIR" -type f | sort
          sha256sum "$EXPORT_ARTIFACT_DIR/manifest.json"

          test -f "$BLOCKED_ARTIFACT_DIR/manifest.json" || {
            echo "No manifest.json in $BLOCKED_ARTIFACT_DIR: the blocked-arm export did not happen." >&2
            echo "Without it the failure-path assertion below has nothing to build from." >&2
            exit 1
          }
          echo "The blocked artifact the failure-path assertion will build from:"
          find "$BLOCKED_ARTIFACT_DIR" -type f | sort

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      # The real read side. EXPORT_DIR is the loader's own
      # `resolveLoadOptionsFromEnv` switch (design.md D-1, "EXPORT_URL live
      # / EXPORT_DIR fixture"): setting it makes getStaticPaths load,
      # digest-verify and Zod-validate the artifact the previous step just
      # wrote. A green build here means the Go writer's bytes satisfy the
      # TypeScript reader's contract -- the one claim no unit test on either
      # side can make on its own.
      - name: astro build from the exported artifact
        working-directory: web
        run: EXPORT_DIR="$EXPORT_ARTIFACT_DIR" npm run build

      # A build can be green because it validated the artifact, or green
      # because it never looked at it. This step separates those: every
      # frozen route must exist in dist/, and the latest value the ARTIFACT
      # carries must appear in the RENDERED HTML. The expected value is read
      # out of the artifact rather than hard-coded, so the assertion cannot
      # drift away from the data it is checking.
      - name: Assert the build consumed the exported artifact
        run: |
          # `pib` is the frozen public route slug; the artifact slugs it
          # `pib-cvi` (config/series/pib-cvi.yaml). Listing the ROUTE slugs
          # here means this step also proves that alias resolves.
          for slug in tasa-de-paro-epa ocupados-epa ipc-general ipc-subyacente pib poblacion-residente; do
            page="web/dist/indicador/$slug/index.html"
            test -f "$page" || { echo "Missing built page: $page" >&2; exit 1; }
            echo "built $page"
          done

          latest="$(node -e '
            const { readFileSync } = require("node:fs");
            const doc = JSON.parse(readFileSync(process.env.EXPORT_ARTIFACT_DIR + "/series/tasa-de-paro-epa.json", "utf-8"));
            const points = doc.points.filter((p) => p.value !== null);
            if (points.length === 0) throw new Error("the exported artifact carries no non-null point to assert on");
            process.stdout.write(String(points[points.length - 1].value));
          ')"
          echo "latest tasa-de-paro-epa value in the exported artifact: $latest"
          grep -qF "$latest" web/dist/indicador/tasa-de-paro-epa/index.html || {
            echo "The rendered page does not contain $latest, the value the exported artifact carries." >&2
            echo "The build is not rendering from the artifact this job exported." >&2
            exit 1
          }
          echo "The rendered page shows the value that was ingested."

      # THE FAILURE PATH, end to end, for the first time (CRITICAL-37).
      # The steps above prove the chain works when nothing is blocked. This
      # one proves the chain still SPEAKS when something is: a series a real
      # validation rule refused, ingested with the real shipped thresholds,
      # must make `astro build` exit non-zero on the frozen-route guard
      # rather than quietly shipping a site with a 404 on a permalink.
      #
      # The script takes BOTH artifacts and builds both: the blocked one
      # must fail naming ocupados-epa, the honest one must still exit 0.
      # Without that second build, an unrelatedly broken build would read as
      # proof that validation blocking reaches the build. See the script's
      # own header for the full "what would have to break" list.
      #
      # Must run AFTER the assertions above: it overwrites web/dist.
      - name: Assert a validation-blocked series fails the build
        run: scripts/assert-blocked-series-fails-build.sh "$BLOCKED_ARTIFACT_DIR" "$EXPORT_ARTIFACT_DIR"

      # The half that had never been proven in CI. Runs `astro build` three
      # more times, each against its own corrupted COPY of the artifact
      # above, and FAILS THIS JOB if any of those builds succeeds -- see the
      # script's own header for why each guard exists and why the assertion
      # cannot pass by being silently inverted.
      #
      # Must run AFTER the assertions above: it overwrites web/dist with the
      # output of failed builds.
      - name: Assert a corrupted artifact fails the build
        run: scripts/assert-corrupt-artifact-fails-build.sh "$EXPORT_ARTIFACT_DIR"
