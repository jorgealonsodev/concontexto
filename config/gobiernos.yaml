# Cambios de gobierno con fecha de toma de posesión (PRD §9.6,
# §6.1.1(a)). Reconciliado por ingestion.ReconcileEditorialConfig a la
# tabla event con event_group "governments" (asignado por el cargador,
# no repetido en cada entrada -- app/internal/adapters/config/loader.go).
#
# SIN COLORES DE PARTIDO en ningún campo de este fichero ni en su tipo Go
# (PRD §12.1: prohibido cualquier color que pueda leerse como color de
# partido) -- sólo id / nombre / fechas / nota.
#
# Cambios en este fichero requieren revisión a cuatro ojos (PRD §9.6,
# §15.2). Ver .github/CODEOWNERS y .github/BRANCH_PROTECTION.md.
#
# PROCEDENCIA DE LAS FECHAS -- léase antes de fusionar: estas fechas
# provienen del conocimiento general documentado del autor, NO de una
# búsqueda web en vivo ni de una fuente citada y verificada en esta
# sesión (no había herramienta WebFetch/WebSearch disponible). Se marcan
# como "confirmadas" únicamente las fechas de alta certeza histórica
# (investiduras posteriores a 1982, ampliamente documentadas); la de
# Adolfo Suárez en 1976 se marca explícitamente unconfirmed por
# incertidumbre genuina sobre el día exacto de toma de posesión frente a
# la fecha de nombramiento. Esta es exactamente la clase de contenido que
# la revisión a cuatro ojos (PRD §9.6) debe verificar contra fuente
# oficial (La Moncloa / BOE) antes de fusionar -- no se ha fabricado una
# verificación que no se ha realizado.

- id: gobierno-suarez-1976
  name: "Adolfo Suárez"
  date_status: unconfirmed
  todo: >-
    Confirmar la fecha exacta de toma de posesión (distinta de la fecha
    de nombramiento, 3 de julio de 1976) contra la fuente histórica
    oficial de La Moncloa (listado de presidentes del Gobierno) o el BOE.
  note_md: "Primer presidente del Gobierno tras el nombramiento real de julio de 1976."

