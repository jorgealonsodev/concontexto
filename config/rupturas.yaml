# Registro de rupturas metodológicas (PRD §9.6). Reconciliado por
# ingestion.ReconcileEditorialConfig a la tabla series_break -- este
# fichero es la fuente de verdad; la base de datos es una proyección
# (design.md "editorial YAML is reconciled -- never hand-edited").
#
# Cambios en este fichero requieren revisión a cuatro ojos (PRD §9.6,
# §15.2): son decisiones editoriales con apariencia técnica, no cambios
# de código rutinarios. Ver .github/CODEOWNERS y .github/BRANCH_PROTECTION.md.
#
# date_status/todo: una entrada cuya fecha efectiva NO está confirmada
# contra la nota metodológica de la fuente declara
# `date_status: unconfirmed` + `todo` (documento a consultar). El
# reconcile NUNCA proyecta a series_break una entrada así -- una fecha de
# ruptura equivocada corrompe silenciosamente cualquier comparación que la
# cruce (principio P4). Ver app/internal/ingestion/reconcile.go.
#
# `date` PUEDE acompañar a `date_status: unconfirmed` con un valor
# provisional, y normalmente es la mejor entrada: la lectura provisional
# junto al `todo` indica a quien edite después tanto el mejor dato actual
# como qué documento hay que consultar para confirmarlo, mientras que un
# campo vacío solo indica que alguien se detuvo. Lo que protege la serie
# es el estado declarado, no que el campo esté vacío: mientras
# `date_status` sea `unconfirmed`, el reconcile retiene la entrada aunque
# lleve fecha. `validate-config` rechaza una entrada confirmada sin `date`.

- id: epa-metodologia-2021
  kind: methodology
  scope: { kind: dataset, ref: ine-epa }
  date: 2021-01-01
  note_md: >-
    Nuevo diseño metodológico de la Encuesta de Población Activa (EPA),
    alineado con el Reglamento Marco IESS de la UE (2019/1700), aplicado
    desde los datos del primer trimestre de 2021. Afecta a la
    comparabilidad de las series de paro, ocupación y actividad con
    periodos anteriores a 2021.
  source_url: "https://www.ine.es/dyngs/INEbase/es/operacion.htm?c=Estadistica_C&cid=1254736176918"

