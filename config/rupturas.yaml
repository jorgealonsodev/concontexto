# ECOICOP ver.2 / enero 2026 -- FECHA CONFIRMADA (orquestador, 2026-07-28,
# a partir de la documentación propia de las fuentes): entra en vigor con
# los datos del IPC de enero de 2026, bajo el Reglamento Delegado (UE)
# 2024/3159 de la Comisión; el cambio de base del IPC a base 2025 se
# adelantó un año expresamente para implementarlo. El IPC pasa de 12 a 13
# grupos principales (el contenido de cuatro de ellos cambia); las
# subclases pasan de 199 (base 2021) a 196.
#
# ALCANCE (revisado respecto a la versión anterior de esta entrada, que
# lo fijaba en "toda la familia de series derivadas del IPC"): el INE
# declara explícitamente que para los agregados que sobreviven a la
# reclasificación "se realizaron los enlaces necesarios para tener series
# históricas completas, sin modificar las tasas de variación previamente
# publicadas". El IPC general y el IPC subyacente -- las series de este
# dataset ya configuradas en Fase 0 (ipc-general, ipc-subyacente) -- son
# agregados de ese tipo: ENLAZADOS, sin ruptura. Esta entrada se limita
# por tanto a las desagregaciones a nivel de subclase COICOP que se
# descontinúan o que son nuevas bajo ECOICOP ver.2 (scope: dataset
# "ine-ipc-subclases", deliberadamente DISTINTO del dataset
# "ine-ipc" que usan ipc-general/ipc-subyacente); ninguna de las seis
# series de Fase 0 pertenece a ese dataset todavía, así que esta ruptura
# no resuelve para ninguna serie actualmente configurada -- queda
# documentada y reconciliada para cuando se añadan series a nivel de
# subclase.
#
# Fuentes: https://www.ine.es/metodologia/t25/metodologia_IPC_base_2025.pdf
# y https://www.ine.es/normativa/leyes/cse/2026_CambioBaseIPC.pdf
- id: ecoicop-v2-2026-ine-ipc
  kind: methodology
  scope: { kind: dataset, ref: ine-ipc-subclases, ref_status: pending }
  date: 2026-01-01
  todo: >-
    Configurar series a nivel de subclase COICOP bajo el dataset
    "ine-ipc-subclases" cuando Fase 1 las añada (ver NOTA DE ESTADO en
    note_md); hasta entonces scope.ref intencionalmente no resuelve
    (remediación 2026-07-29, sdd-verify W2).
  note_md: >-
    Adopción de ECOICOP ver.2 en el IPC (INE), en vigor con los datos de
    enero de 2026 (Reglamento Delegado (UE) 2024/3159 de la Comisión). El
    IPC pasa de 12 a 13 grupos principales (contenido de cuatro
    modificado) y de 199 a 196 subclases. El IPC general y el IPC
    subyacente están ENLAZADOS: el INE declara que las tasas de variación
    previamente publicadas de los agregados que sobreviven la
    reclasificación no se modifican. Esta ruptura aplica únicamente a las
    desagregaciones a nivel de subclase COICOP descontinuadas o nuevas
    bajo ECOICOP ver.2, no al IPC general ni al IPC subyacente. Véase
    también https://www.ine.es/normativa/leyes/cse/2026_CambioBaseIPC.pdf.
    NOTA DE ESTADO (remediación 2026-07-29, sdd-verify W3): de las DIEZ
    series configuradas hoy en Fase 0 -- no seis, cifra de milestone 0.2
    citada más arriba, ya desactualizada tras las series de Eurostat y
    Seguridad Social añadidas en fases 5b/6/8 -- NINGUNA pertenece al
    dataset "ine-ipc-subclases"; esta ruptura no resuelve para ninguna
    serie configurada hoy (ResolveActiveBreaksForSeries). El ámbito
    coincidente más próximo, "ine-ipc", lo usan ipc-general/ipc-subyacente,
    deliberadamente excluidas por diseño (enlazadas, sin ruptura), no por
    omisión. Placeholder documentado a la espera de que Fase 1 configure
    series a nivel de subclase COICOP.
  source_url: "https://www.ine.es/metodologia/t25/metodologia_IPC_base_2025.pdf"

# ECOICOP ver.2 en el HICP de Eurostat -- FECHA CONFIRMADA (misma
# investigación, 2026-07-28): nuevos requisitos de transmisión del HICP a
# partir del mes de referencia enero de 2026 (misma Regulación Delegada
# (UE) 2024/3159); los índices de enero de 2026 se encadenan a ECOICOP
# ver.2 bajo el Reglamento de Ejecución (UE) 2024/1720 y se rebasan al
# periodo de referencia del índice 2025; Eurostat facilita series
# históricas recalculadas bajo ECOICOP ver.2.
#
# ALCANCE -- NOTA DE PRUDENCIA (distinta de la entrada equivalente del
# INE de arriba): a diferencia del INE, la propia documentación de
# Eurostat consultada NO afirma explícitamente que las tasas de variación
# previamente publicadas del HICP agregado queden sin modificar; su
# propia redacción es una advertencia, no una garantía: "Potential breaks
# in the HICP data for January 2026 are possible as a result of the
# classification changes and the applied methodological change." Ante
# esa asimetría de evidencia, esta entrada adopta el mismo alcance
# prudente que la entrada del INE (desagregaciones a nivel de subclase
# COICOP, scope: dataset "eurostat-hicp-subclases", distinto del
# dataset "eurostat-hicp" que usa ipc-armonizado-eurostat) en lugar de
# asumir sin confirmación que la serie armonizada agregada ya configurada
# en Fase 0 (ipc-armonizado-eurostat) está enlazada como su equivalente
# del INE: el riesgo de un falso positivo de ruptura sobre una serie
# cabecera pesa más que el de una desagregación aún sin configurar en
# Fase 0. Si en el futuro se confirma el tratamiento real que Eurostat
# aplica a la serie armonizada agregada, esta entrada debe revisarse.
#
# Fuente: https://ec.europa.eu/eurostat/documents/272892/11336726/HICP+improvements+-+Questions+and+Answers-2026-EN.pdf
- id: ecoicop-v2-2026-eurostat-hicp
  kind: methodology
  scope: { kind: dataset, ref: eurostat-hicp-subclases, ref_status: pending }
  date: 2026-01-01
  todo: >-
    Configurar series a nivel de subclase COICOP bajo el dataset
    "eurostat-hicp-subclases" cuando Fase 1 las añada (ver NOTA DE ESTADO
    en note_md); hasta entonces scope.ref intencionalmente no resuelve
    (remediación 2026-07-29, sdd-verify W2).
  note_md: >-
    Nuevos requisitos de transmisión del HICP de Eurostat a partir del
    mes de referencia enero de 2026 (Reglamento Delegado (UE)
    2024/3159); los índices de enero de 2026 se encadenan a ECOICOP
    ver.2 (Reglamento de Ejecución (UE) 2024/1720) y se rebasan al
    periodo de referencia del índice 2025; Eurostat facilita series
    históricas recalculadas bajo ECOICOP ver.2. Cita textual de
    Eurostat: "Potential breaks in the HICP data for January 2026 are
    possible as a result of the classification changes and the applied
    methodological change." A diferencia del IPC del INE, Eurostat no
    garantiza explícitamente que la serie armonizada agregada quede sin
    modificar; por prudencia, esta ruptura se limita a las
    desagregaciones a nivel de subclase COICOP y no se aplica a la serie
    armonizada agregada ya configurada en Fase 0 (ipc-armonizado-eurostat)
    hasta que se confirme el tratamiento real de Eurostat para esa serie.
    NOTA DE ESTADO (remediación 2026-07-29, sdd-verify W3): de las DIEZ
    series configuradas hoy en Fase 0, ninguna pertenece al dataset
    "eurostat-hicp-subclases"; esta ruptura no resuelve para ninguna
    serie configurada hoy (ResolveActiveBreaksForSeries). El ámbito
    coincidente más próximo, "eurostat-hicp", lo usa
    ipc-armonizado-eurostat, deliberadamente excluida por la nota de
    prudencia de arriba, no por omisión. Placeholder documentado a la
    espera de que Fase 1 configure series a nivel de subclase COICOP.
  source_url: "https://ec.europa.eu/eurostat/documents/272892/11336726/HICP+improvements+-+Questions+and+Answers-2026-EN.pdf"

