# Source identity and licensing for Eurostat (European Statistical
# Office). Verified live 2026-07-28 (Engram #4692). Every dataset
# dimension except `time` MUST be pinned by any series that references
# this source — validate-config enforces it (spec
# source-attribution-licensing / task 3.9), because an unfiltered
# prc_hicp_minr request returned HTTP 200 and 157 MB against a 256 MB
# container.
#
# Redistribution terms are recorded here as structured fields, not
# flattened prose, precisely because they differ from a simple "reuse
# freely" grant: Commission Decision 2011/833/EU authorises reuse of
# Eurostat's OWN material with acknowledgement, but that permission does
# NOT extend to third-party material Eurostat republishes, and some
# commercial redissemination of Eurostat data is separately restricted.
# LICENSE-DATA defers to this file rather than asserting one blanket
# licence over all derived data (settled decision D2).
id: eurostat
name: "Eurostat — European Statistical Office"
url: https://ec.europa.eu/eurostat
access_type: api-json
api:
  base_url: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data"
  max_response_bytes: 8388608 # 8 MiB (design.md "Response ceiling" default)
licence:
  name: "Reuse under Commission Decision 2011/833/EU"
  url: "https://ec.europa.eu/eurostat/about/policies/copyright"
  attribution_text: "Source: Eurostat"
  redistribution:
    allowed: true
    conditions_md: >-
      Reuse of Eurostat data is authorised, provided the source is
      acknowledged, under Commission Decision 2011/833/EU on the reuse of
      Commission documents (https://ec.europa.eu/eurostat/about/policies/copyright).
      This acknowledgement-only permission covers Eurostat's own material.
    commercial_restrictions_md: >-
      The Commission Decision 2011/833/EU permission does NOT extend to
      third-party material Eurostat may republish, and some commercial
      redissemination of Eurostat data is separately restricted; verify
      the specific dataset's copyright notice before any commercial
      redistribution.
    acknowledgement_required: true
    third_party_excluded: true
